[project]
name = "vaultsync"
version = "0.1.0"
description = "Encrypted local file store & public-key sync engine"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0.0"]

[project.scripts]
vaultsync = "vaultsync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vaultsync*"]